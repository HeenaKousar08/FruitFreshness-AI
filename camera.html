<!DOCTYPE html>
<html>
<head>
    <title>AI Shelf Life Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        .camera-container { border: 4px solid #00ff00; border-radius: 20px; box-shadow: 0 0 20px #00ff00; }
        .status-badge { background: #28a745; padding: 10px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5 text-center">
        <h1 class="mb-2">🎯 Real-Time Shelf Life Prediction</h1>
        <p class="text-success fw-bold">AI Freshness Detection System Active</p>

        <div class="row mt-4">
            <div class="col-md-9 mx-auto camera-container p-0 overflow-hidden">
                <img src="{{ url_for('video_feed') }}" width="100%">
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-4">
                <div class="card bg-dark border-success p-3">
                    <h5>Inventory Health</h5>
                    <p class="h2 text-success">98%</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark border-warning p-3">
                    <h5>Waste Prevented</h5>
                    <p class="h2 text-warning">12.4kg</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark border-primary p-3">
                    <h5>Items Scanned</h5>
                    <p class="h2 text-primary">142</p>
                </div>
            </div>
        </div>
        
        <div class="mt-5">
            <a href="/" class="btn btn-outline-light">Back to Manual Analysis</a>
        </div>
    </div>
</body>
</html>
